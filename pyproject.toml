[project]
name = "llm-worker"
version = "0.1.0"
description = "Service that polls ClickHouse for LLM evaluation inputs, calls the configured LLM provider, and writes results back"
requires-python = ">=3.14"
scripts = { llm-worker = "llm_worker.main:run" }
dependencies = [
    "clickhouse-connect>=0.8.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Keyed by cloud platform (the image variant), not the LLM backend: aws ships
# the Bedrock SDK, gcp the Anthropic Vertex SDK, azure the Anthropic + Azure
# identity SDKs. The runtime backend is selected separately via LLM_PROVIDER
# (aws->bedrock, gcp->vertex, azure->foundry).
aws = ["boto3>=1.42.0"]
gcp = ["anthropic[vertex]>=0.40.0"]
azure = ["anthropic>=0.116.0", "azure-identity>=1.19.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not clickhouse and not vertex and not azure"]
markers = [
    "clickhouse: tests that require a running ClickHouse container",
    "vertex: tests that hit a live Vertex AI deployment (real credentials)",
    "azure: tests that hit a live Microsoft Foundry deployment (real credentials)",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
