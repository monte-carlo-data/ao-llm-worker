[project]
name = "llm-worker"
version = "0.1.0"
description = "Service that polls ClickHouse for LLM evaluation inputs, calls Bedrock, and writes results back"
requires-python = ">=3.14"
scripts = { llm-worker = "llm_worker.main:run" }
dependencies = [
    "boto3>=1.42.0",
    "clickhouse-connect>=0.8.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not clickhouse"]
markers = [
    "clickhouse: tests that require a running ClickHouse container",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
