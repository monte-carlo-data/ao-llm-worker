[project]
name = "llm-worker"
version = "0.1.0"
description = "Service that polls ClickHouse for LLM evaluation inputs, calls Bedrock, and writes results back"
requires-python = ">=3.14"
scripts = { llm-worker = "llm_worker.main:run" }
dependencies = [
    "clickhouse-connect>=0.8.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Keyed by cloud platform (the image variant), not the LLM backend: aws ships
# the Bedrock SDK, gcp the Anthropic Vertex SDK. The runtime backend is selected
# separately via LLM_PROVIDER (aws->bedrock, gcp->vertex).
aws = ["boto3>=1.42.0"]
gcp = ["anthropic[vertex]>=0.40.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not clickhouse and not vertex"]
markers = [
    "clickhouse: tests that require a running ClickHouse container",
    "vertex: tests that hit a live Vertex AI deployment (real credentials)",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
