version: 2.1

orbs:
  docker: circleci/docker@2.2.0

jobs:
  lint:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen
      - run:
          name: Ruff
          command: uv run ruff check src/ tests/
      - run:
          name: Pyright
          command: uv run pyright src/

  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen
      - run:
          name: Unit tests
          command: uv run pytest

  build-and-push:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Verify tag is on main
          command: |
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$CIRCLE_TAG" origin/main; then
              echo "Tag $CIRCLE_TAG is not an ancestor of origin/main — refusing to publish."
              exit 1
            fi
            echo "Tag $CIRCLE_TAG is on main, proceeding."
      - run:
          name: Extract version from tag
          command: echo "export VERSION_TAG=${CIRCLE_TAG#v}" >> "$BASH_ENV"
      - docker/check:
          use-docker-credentials-store: true
      - docker/build:
          image: montecarlodata/ao-llm-worker
          tag: ${VERSION_TAG},latest
      - docker/push:
          image: montecarlodata/ao-llm-worker
          tag: ${VERSION_TAG},latest

workflows:
  build-and-deploy:
    jobs:
      - lint:
          filters:
            tags:
              only: /^v.*/
      - test:
          filters:
            tags:
              only: /^v.*/
      - build-and-push:
          context:
            - docker
          requires:
            - lint
            - test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
