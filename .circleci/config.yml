version: 2.1

orbs:
  docker: circleci/docker@2.2.0

commands:
  license-drift-check:
    description: >
      Regenerate the platform's NOTICE + LICENSES/ from the just-built image and
      fail if they differ from what's committed — so a dependency change can't
      ship without its license artifacts being updated. Runs before the push.
    parameters:
      cloud:
        type: string
      image:
        type: string
    steps:
      - run:
          name: Verify license artifacts match the built image
          command: |
            python3 scripts/gen_licenses.py --cloud << parameters.cloud >> --image << parameters.image >> --check

jobs:
  lint:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen --all-extras
      - run:
          name: Ruff
          command: uv run ruff check src/ tests/
      - run:
          name: Pyright
          command: uv run pyright src/

  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen --all-extras
      - run:
          name: Unit tests
          command: uv run pytest

  build-and-push:
    parameters:
      cloud:
        type: string
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Verify tag is on main
          command: |
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$CIRCLE_TAG" origin/main; then
              echo "Tag $CIRCLE_TAG is not an ancestor of origin/main — refusing to publish."
              exit 1
            fi
            echo "Tag $CIRCLE_TAG is on main, proceeding."
      - run:
          name: Extract version from tag
          command: echo "export VERSION_TAG=${CIRCLE_TAG#v}" >> "$BASH_ENV"
      - docker/check:
          use-docker-credentials-store: true
      - docker/build:
          image: montecarlodata/ao-llm-worker
          tag: ${VERSION_TAG}-<< parameters.cloud >>,latest-<< parameters.cloud >>
          extra_build_args: --build-arg CLOUD=<< parameters.cloud >>
      - license-drift-check:
          cloud: << parameters.cloud >>
          image: montecarlodata/ao-llm-worker:${VERSION_TAG}-<< parameters.cloud >>
      - docker/push:
          image: montecarlodata/ao-llm-worker
          tag: ${VERSION_TAG}-<< parameters.cloud >>,latest-<< parameters.cloud >>

  # Pre-release images from the dev branch, matching the AO helm chart's dev
  # scheme (0.0.0-dev.g<sha> per-commit + 0.0.0-latest floating), platform-suffixed.
  publish-dev:
    parameters:
      cloud:
        type: string
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Compute dev version from commit
          command: echo "export DEV_VERSION=0.0.0-dev.g$(git rev-parse --short=7 HEAD)" >> "$BASH_ENV"
      - docker/check:
          use-docker-credentials-store: true
      - docker/build:
          image: montecarlodata/ao-llm-worker
          tag: ${DEV_VERSION}-<< parameters.cloud >>,0.0.0-latest-<< parameters.cloud >>
          extra_build_args: --build-arg CLOUD=<< parameters.cloud >>
      - license-drift-check:
          cloud: << parameters.cloud >>
          image: montecarlodata/ao-llm-worker:${DEV_VERSION}-<< parameters.cloud >>
      - docker/push:
          image: montecarlodata/ao-llm-worker
          tag: ${DEV_VERSION}-<< parameters.cloud >>,0.0.0-latest-<< parameters.cloud >>

workflows:
  build-and-deploy:
    jobs:
      - lint:
          filters:
            tags:
              only: /^v.*/
      - test:
          filters:
            tags:
              only: /^v.*/
      - publish-dev:
          matrix:
            parameters:
              cloud: [aws, azure, gcp]
          context:
            - docker
          requires:
            - lint
            - test
          filters:
            branches:
              only: dev
      - build-and-push:
          matrix:
            parameters:
              cloud: [aws, azure, gcp]
          context:
            - docker
          requires:
            - lint
            - test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
