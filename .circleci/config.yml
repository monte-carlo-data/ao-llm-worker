version: 2.1

orbs:
  docker: circleci/docker@2.2.0
  mcd-tools: monte-carlo/mcd-ci-tools@1.11.0

commands:
  license-drift-check:
    description: >
      Regenerate the platform's NOTICE + LICENSES/ from the just-built image and
      fail if they differ from what's committed — so a dependency change can't
      ship without its license artifacts being updated. Runs before the push.
    parameters:
      cloud:
        type: string
      image:
        type: string
    steps:
      - run:
          name: Verify license artifacts match the built image
          command: |
            python3 scripts/gen_licenses.py --cloud << parameters.cloud >> --image << parameters.image >> --check

  build-check-push:
    description: >
      Build the per-cloud image, verify its license artifacts, and push. Shared
      by the tagged-release and dev-branch jobs, which differ only in how they
      compute the version and floating tag.
    parameters:
      cloud:
        type: string
      version:
        type: string
      latest_tag:
        type: string
    steps:
      - docker/check:
          use-docker-credentials-store: true
      - docker/build:
          image: montecarlodata/ao-llm-worker
          tag: << parameters.version >>-<< parameters.cloud >>,<< parameters.latest_tag >>-<< parameters.cloud >>
          extra_build_args: --build-arg CLOUD=<< parameters.cloud >>
      - license-drift-check:
          cloud: << parameters.cloud >>
          image: montecarlodata/ao-llm-worker:<< parameters.version >>-<< parameters.cloud >>
      # Azure leg only (SEC-3726). Warn mode: findings are reported in the log and the
      # vuln-image-scan artifacts, and the push still happens. Set fail_on_findings: true to block.
      - when:
          condition:
            equal: [azure, << parameters.cloud >>]
          steps:
            - mc-vuln-image-scan:
                image: montecarlodata/ao-llm-worker:<< parameters.version >>-<< parameters.cloud >>
      - docker/push:
          image: montecarlodata/ao-llm-worker
          tag: << parameters.version >>-<< parameters.cloud >>,<< parameters.latest_tag >>-<< parameters.cloud >>

  # Copied from monte-carlo-data/mc-security .circleci/vuln-image-scan.yml (SEC-3726).
  # Keep in sync with that file; docs: vuln-mgmt-scanner/Centralized_Docker_Scanning.md.
  mc-vuln-image-scan:
    description: >
      Scan a Docker image with mc-security's centralized scanner (Trivy, plus Wiz/Aikido/Scout when
      their credentials are set), store the reports as artifacts, then apply the gate. Needs a job
      that requires fetch-mc-security-scanner and has a Docker daemon (machine executor or
      setup_remote_docker).
    parameters:
      image:
        type: string
        description: Image(s) to scan, space-separated. Env vars such as ${VERSION_TAG} are expanded.
      severity:
        type: string
        default: "CRITICAL,HIGH"
        description: Severity filter, which is also the gate threshold.
      customer_cves:
        type: string
        default: ""
        description: Comma-separated customer-reported CVE IDs to cross-reference.
      scanners:
        type: string
        default: ""
        description: Subset of trivy,scout,wiz,aikido. Empty runs every scanner that has credentials.
      fail_on_findings:
        type: boolean
        default: false
        description: Fail the job when the scan finds anything or doesn't complete. Off is warn mode.
      local_image:
        type: boolean
        default: true
        description: >
          Scan the copy in the local Docker daemon (build with --load first). Turn off only to scan
          an image already in a registry.
      workspace_root:
        type: string
        default: /tmp/mc-security-workspace
      output_dir:
        type: string
        default: /tmp/mc-security-scan-results
        description: Kept outside the checkout so reports never enter a `docker build .` context.
    steps:
      - attach_workspace:
          at: << parameters.workspace_root >>
      - run:
          name: Install image scanners (pinned)
          # In warn mode a download outage must not block a release: the scan then records
          # "error" and the gate warns. With the gate on it fails here.
          command: |
            if ! bash "<< parameters.workspace_root >>/mc-security-scanner/ci/install-scanners.sh"; then
              echo "[WARNING] Scanner install failed; the scan will record an error."
              [ "<< parameters.fail_on_findings >>" != true ] || exit 1
            fi
      - run:
          name: Vulnerability scan (mc-security)
          environment:
            SCAN_SEVERITY: << parameters.severity >>
            SCAN_CUSTOMER_CVES: << parameters.customer_cves >>
            SCAN_SCANNERS: << parameters.scanners >>
            SCAN_LOCAL_IMAGE: << parameters.local_image >>
            SCAN_OUTPUT_DIR: << parameters.output_dir >>
          command: |
            echo "mc-security scanner at $(cat "<< parameters.workspace_root >>/mc-security-scanner/MC_SECURITY_SHA")"
            SCAN_IMAGES="<< parameters.image >>" \
              bash "<< parameters.workspace_root >>/mc-security-scanner/ci/ci-scan.sh" scan
      - store_artifacts:
          path: << parameters.output_dir >>
          destination: vuln-image-scan
      - run:
          name: Enforce vulnerability gate
          environment:
            SCAN_FAIL_ON_FINDINGS: << parameters.fail_on_findings >>
            SCAN_SEVERITY: << parameters.severity >>
            SCAN_OUTPUT_DIR: << parameters.output_dir >>
          command: bash "<< parameters.workspace_root >>/mc-security-scanner/ci/ci-scan.sh" gate

jobs:
  # Copied from monte-carlo-data/mc-security .circleci/vuln-image-scan.yml (SEC-3726).
  # Keep in sync with that file; docs: vuln-mgmt-scanner/Centralized_Docker_Scanning.md.
  fetch-mc-security-scanner:
    description: >
      Fetch mc-security's scanner scripts at one commit and persist them to the workspace. Run with
      the "GitHub PR Manager" context; give it the same branch/tag filters as the jobs that need it.
    parameters:
      mc_security_ref:
        type: string
        default: main
        description: >
          mc-security commit SHA (preferred), tag or branch. Pin a SHA so the code that runs next to
          your push credentials can't change under you.
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - mcd-tools/mint-github-token:
          output_var: MC_SECURITY_TOKEN
          repositories: '["mc-security"]'
          permissions: '{"contents":"read"}'
      - run:
          name: Fetch scanner scripts from mc-security
          environment:
            MC_SECURITY_REF: << parameters.mc_security_ref >>
          command: |
            set +x
            dest=/tmp/mc-security-workspace/mc-security-scanner
            api=https://api.github.com/repos/monte-carlo-data/mc-security
            mkdir -p "${dest}/ci"
            # The token goes to curl on stdin, never argv (visible in /proc/<pid>/cmdline).
            gh_get() {
              printf 'Authorization: Bearer %s\n' "${MC_SECURITY_TOKEN}" \
                | curl -fsSL --retry 3 -H @- -H "Accept: $1" "$2"
            }
            # Resolve the ref once so every file comes from the same commit.
            sha="$(gh_get application/vnd.github.sha "${api}/commits/${MC_SECURITY_REF}")"
            for path in \
                vuln-mgmt-scanner/scan-image.sh \
                vuln-mgmt-scanner/ci/ci-scan.sh \
                vuln-mgmt-scanner/ci/install-scanners.sh; do
              gh_get application/vnd.github.raw "${api}/contents/${path}?ref=${sha}" \
                > "${dest}/${path#vuln-mgmt-scanner/}"
            done
            echo "${sha}" > "${dest}/MC_SECURITY_SHA"
            echo "Fetched mc-security scanner at ${sha} (ref: ${MC_SECURITY_REF})"
      - persist_to_workspace:
          root: /tmp/mc-security-workspace
          paths:
            - mc-security-scanner

  lint:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen --all-extras
      - run:
          name: Ruff
          command: uv run ruff check src/ tests/
      - run:
          name: Pyright
          command: uv run pyright src/

  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install dependencies
          command: uv sync --frozen --all-extras
      - run:
          name: Unit tests
          command: uv run pytest

  build-and-push:
    parameters:
      cloud:
        type: string
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Verify tag is on main
          command: |
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$CIRCLE_TAG" origin/main; then
              echo "Tag $CIRCLE_TAG is not an ancestor of origin/main — refusing to publish."
              exit 1
            fi
            echo "Tag $CIRCLE_TAG is on main, proceeding."
      - run:
          name: Extract version from tag
          command: echo "export VERSION_TAG=${CIRCLE_TAG#v}" >> "$BASH_ENV"
      - build-check-push:
          cloud: << parameters.cloud >>
          version: ${VERSION_TAG}
          latest_tag: latest

  # Pre-release images from the dev branch, matching the AO helm chart's dev
  # scheme (0.0.0-dev.g<sha> per-commit + 0.0.0-latest floating), platform-suffixed.
  publish-dev:
    parameters:
      cloud:
        type: string
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Compute dev version from commit
          command: echo "export DEV_VERSION=0.0.0-dev.g$(git rev-parse --short=7 HEAD)" >> "$BASH_ENV"
      - build-check-push:
          cloud: << parameters.cloud >>
          version: ${DEV_VERSION}
          latest_tag: 0.0.0-latest

workflows:
  build-and-deploy:
    jobs:
      # Same branch/tag coverage as the publish jobs that require it. Mints a read-only
      # mc-security token, so the repo must be allowed on the GitHub PR Manager context.
      - fetch-mc-security-scanner:
          mc_security_ref: main
          context:
            - GitHub PR Manager
          filters:
            branches:
              only: dev
            tags:
              only: /^v.*/
      - lint:
          filters:
            tags:
              only: /^v.*/
      - test:
          filters:
            tags:
              only: /^v.*/
      - publish-dev:
          matrix:
            parameters:
              cloud: [aws, azure, gcp]
          context:
            - docker
          requires:
            - fetch-mc-security-scanner
            - lint
            - test
          filters:
            branches:
              only: dev
      - build-and-push:
          matrix:
            parameters:
              cloud: [aws, azure, gcp]
          context:
            - docker
          requires:
            - fetch-mc-security-scanner
            - lint
            - test
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
